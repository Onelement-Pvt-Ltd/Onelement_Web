version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      root-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/client"
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/server"
    schedule:
      interval: weekly
    groups:
      backend-dependencies:
        patterns: ["*"]
