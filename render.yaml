services:
  - type: web
    name: onelement
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGINS
        value: https://onelement.in,https://www.onelement.in
      - key: TRUST_PROXY
        value: "1"
      - key: SHUTDOWN_TIMEOUT_MS
        value: "10000"
      - key: MONGO_URI
        sync: false
      - key: VIEW_STATS_USERNAME
        sync: false
      - key: VIEW_STATS_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CONTACT_FROM
        value: web@onelement.in
      - key: CONTACT_TO
        value: web@onelement.in
